name: bugtimeai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bugtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugtime}
      POSTGRES_DB: ${POSTGRES_DB:-bugtime}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugtime}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  runner:
    build:
      context: ./runner
    image: bugtime-pytest-runner:latest
    profiles: ["build-runner"]

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bugtime:bugtime@postgres:5432/bugtime
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      REPOS_DIR: /data/repos
      DEMO_REPO_PATH: /app/demo-repo-v2
      RUNNER_IMAGE: bugtime-pytest-runner:latest
      DATA_VOLUME_NAME: bugtimeai_app_data
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-4000}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-600}
      MODEL_JSON_MODE: ${MODEL_JSON_MODE:-true}
      REPAIR_MAX_ATTEMPTS: ${REPAIR_MAX_ATTEMPTS:-3}
      REPAIR_MAX_DURATION_SECONDS: ${REPAIR_MAX_DURATION_SECONDS:-600}
      RERANKER_MODE: ${RERANKER_MODE:-disabled}
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-}
      RERANKER_CANDIDATE_LIMIT: ${RERANKER_CANDIDATE_LIMIT:-50}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      GITHUB_DEFAULT_TARGET_BRANCH: ${GITHUB_DEFAULT_TARGET_BRANCH:-main}
    volumes:
      - app_data:/data
      - ./demo-repo-v2:/app/demo-repo-v2:ro
      - ./data/rerank:/app/seed/rerank:ro
      - ./data/rerank:/data/rerank
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bugtime:bugtime@postgres:5432/bugtime
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      REPOS_DIR: /data/repos
      DEMO_REPO_PATH: /app/demo-repo-v2
      WORKER_MODE: index
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-4000}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-600}
      MODEL_JSON_MODE: ${MODEL_JSON_MODE:-true}
      REPAIR_MAX_ATTEMPTS: ${REPAIR_MAX_ATTEMPTS:-3}
      REPAIR_MAX_DURATION_SECONDS: ${REPAIR_MAX_DURATION_SECONDS:-600}
      RERANKER_MODE: ${RERANKER_MODE:-disabled}
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-}
      RERANKER_CANDIDATE_LIMIT: ${RERANKER_CANDIDATE_LIMIT:-50}
    volumes:
      - app_data:/data
      - ./demo-repo-v2:/app/demo-repo-v2:ro
      - ./data/rerank:/app/seed/rerank:ro
      - ./data/rerank:/data/rerank
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      backend:
        condition: service_started
    command: python -m app.workers.runner

  executor:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bugtime:bugtime@postgres:5432/bugtime
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      REPOS_DIR: /data/repos
      DEMO_REPO_PATH: /app/demo-repo-v2
      WORKER_MODE: exec
      RUNNER_IMAGE: bugtime-pytest-runner:latest
      DATA_VOLUME_NAME: bugtimeai_app_data
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-120}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-4000}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-600}
      MODEL_JSON_MODE: ${MODEL_JSON_MODE:-true}
      REPAIR_MAX_ATTEMPTS: ${REPAIR_MAX_ATTEMPTS:-3}
      REPAIR_MAX_DURATION_SECONDS: ${REPAIR_MAX_DURATION_SECONDS:-600}
    volumes:
      - app_data:/data
      - ./demo-repo-v2:/app/demo-repo-v2:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: python -m app.workers.runner

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_INTERNAL_URL: http://backend:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  app_data:
  huggingface_cache:
